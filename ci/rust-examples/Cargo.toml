[package]
name = "dna-rust-examples"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone crate so it never tries to join a parent workspace.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "serde-well-known", "macros", "formatting", "parsing"] }
uuid = { version = "1", features = ["v7", "serde"] }
utoipa = { version = "5", features = ["uuid", "time"] }
axum = "0.8"
humantime-serde = "1"
base64 = "0.22"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "time", "uuid", "macros"] }
